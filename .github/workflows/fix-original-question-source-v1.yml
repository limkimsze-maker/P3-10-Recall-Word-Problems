name: Fix Original Question Source V1
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('function compareRunSVG(mon,tue,diff,"Lap 1","Lap 2")','function compareRunSVG(mon,tue,diff,day1,day2)')
          s=s.replace('What is the total length of both ribbons?','What is the total length of both streamers?')
          p.write_text(s,encoding='utf-8')
          PY
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Fix Triathlon after original question rewrite"
          git push
