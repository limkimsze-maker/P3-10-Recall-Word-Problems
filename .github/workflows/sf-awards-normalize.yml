name: Restore Practice 10 and install Sports Fiesta awards
permissions:
  contents: write
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact pre-medal Practice 10 questions and add award hook
        run: |
          git show 3651dc404e21980637b43c62be7d7702003a7848:index.html > index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script[^>]+src=["\'][^"\']*sports-fiesta-(?:medal-hook-v4|awards-v1)\.js[^"\']*["\'][^>]*></script>\s*','\n',s,flags=re.I)
          tag='<script src="https://limkimsze-maker.github.io/P3-Length-Mass-and-Volume-Sports-Fiesta-/sports-fiesta-awards-v1.js?v=20260819b" data-practice="10" data-sport="Triathlon"></script>'
          i=s.lower().rfind('</body>')
          if i<0: raise SystemExit('No </body> found')
          s=s[:i]+tag+'\n'+s[i:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit restored Practice 10
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restore Practice 10 and use medal-only award hook"
          git push
